# ============================================
# KITTY CONFIGURATION
# ============================================

# --------------------------------------------
# FONT CONFIGURATION
# --------------------------------------------
font_family      JetBrainsMonoNL Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.0

# --------------------------------------------
# UI SETTINGS
# --------------------------------------------
# Color scheme (Kitty uses different names)
# nightfox is available in Kitty's color schemes
color_scheme nightfox

# Window decorations (Kitty uses different syntax)
# RESIZE in WezTerm = no title bar, only resize borders
window_border_width 0
window_padding_width 0
draw_minimal_borders yes

# Scrollback
scrollback_lines 10000

# Focus follows mouse (Kitty's terminology)
focus_follows_mouse no

# Background opacity and blur (Kitty doesn't have native blur)
background_opacity 0.9
# background_blur is not a native Kitty option on macOS
# See: https://www.reddit.com/r/KittyTerminal/comments/1eko4jr/how_to_use_background_blur_in_kitty
# Alternative: Use a compositor like picom on Linux or accept no blur on macOS

# Disable font size adjustment on window change
# No direct equivalent, but Kitty doesn't auto-adjust window size on font change

# --------------------------------------------
# KEYBOARD PROTOCOLS (For zellij compatibility)
# --------------------------------------------
# Kitty keyboard protocol is enabled by default in Kitty
# https://sw.kovidgoyal.net/kitty/conf/#kitty-kitty-keyboard-protocol
# No additional configuration needed - Kitty supports its protocol natively

# CSI u key encoding (not needed in Kitty as it uses its own protocol)
# Kitty doesn't use CSI u encoding, it has its own keyboard protocol

# --------------------------------------------
# WINDOW PADDING
# --------------------------------------------
# WezTerm padding: left=0, right=0, top=0, bottom=0
# Kitty uses window_padding_width (single value) or window_padding
window_padding_width 0

# --------------------------------------------
# DEFAULT PROGRAM/SHELL
# --------------------------------------------
# For Windows WSL: Use the shell option directly
# On Linux/macOS, this would be your default shell
shell /bin/zsh  # Change to your preferred shell

# For Windows WSL specifically, you might need:
# shell wsl.exe -d archlinux -- /bin/zsh

# --------------------------------------------
# LEADER KEY EQUIVALENT
# --------------------------------------------
# Kitty doesn't have a direct "leader key" concept like WezTerm
# Instead, use keybindings with modifiers
# Original: CTRL+s as leader with 2000ms timeout

# You can map frequently used actions to CTRL+s combinations
# Example: map ctrl+s>e scroll_to_prompt 1
# But there's no direct timeout equivalent in Kitty

# --------------------------------------------
# KEYBINDINGS
# --------------------------------------------
# Reload configuration
map ctrl+shift+r load_config_file

# Note: CMD key is typically mapped to ctrl on macOS in Kitty
# Original used CMD|SHIFT+r, which translates to ctrl+shift+r in Kitty

# --------------------------------------------
# TAB BAR SETTINGS
# --------------------------------------------
# Hide tab bar if only one tab (WezTerm: hide_tab_bar_if_only_one_tab = true)
tab_bar_min_tabs 1  # 1 means show when at least 1 tab (always show)
# For "hide if only one", set to 2:
# tab_bar_min_tabs 2

# Tab bar position (WezTerm: tab_bar_at_bottom = true)
tab_bar_edge bottom

# Use fancy tab bar (WezTerm: use_fancy_tab_bar = false)
tab_bar_style powerline  # or "slant", "separator", etc.

# Tab indices (WezTerm: tab_and_split_indices_are_zero_based = false)
# Kitty uses 0-based indices by default
# No direct configuration to change this

# Max tab width (WezTerm: tab_max_width = 32)
tab_max_width 32

# Switch to last active tab when closing tab (WezTerm: switch_to_last_active_tab_when_closing_tab = true)
# No direct equivalent in Kitty, but you can use:
# map ctrl+tab previous_tab
# map ctrl+shift+tab next_tab

# --------------------------------------------
# ADDITIONAL KITTY-SPECIFIC SETTINGS
# --------------------------------------------
# Enable kitty keyboard protocol (usually enabled by default)
kitty_kitty_keyboard_protocol yes

# Enable CSI u key encoding (not needed in Kitty, but if you need compatibility)
# csi_u_key_encoding yes  # Usually not needed in Kitty

# macOS specific settings (if applicable)
# macos_titlebar_color system
# macos_option_as_alt yes  # If you need Option as Meta key

# Performance settings
# repaint_delay 10  # 10ms (default)
# input_delay 3     # 3ms (default)

# ============================================
# END OF CONFIGURATION
# ============================================
