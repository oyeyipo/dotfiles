# --------------------------------------------
# FONT CONFIGURATION
# --------------------------------------------
font_family      JetBrainsMonoNL Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.0

# --------------------------------------------
# UI SETTINGS
# --------------------------------------------
color_scheme nightfox

# Window decorations
hide_window_decorations yes
window_border_width 0
window_padding_width 0
draw_minimal_borders yes

# Scrollback
scrollback_lines 10000

# Focus follows mouse (Kitty's terminology)
focus_follows_mouse no

# Background opacity and blur (Kitty doesn't have native blur)
# background_blur is not a native Kitty option on macOS
# See: https://www.reddit.com/r/KittyTerminal/comments/1eko4jr/how_to_use_background_blur_in_kitty
# Alternative: Use a compositor like picom on Linux or accept no blur on macOS
background_opacity 0.5
background_blur 1

# --------------------------------------------
# WINDOW PADDING
# --------------------------------------------
# Kitty uses window_padding_width (single value) or window_padding
window_padding_width 0

# --------------------------------------------
# DEFAULT PROGRAM/SHELL
# --------------------------------------------
# For Windows WSL: Use the shell option directly
# On Linux/macOS, this would be your default shell
shell /bin/sh

# For Windows WSL specifically, you might need:
# shell wsl.exe -d archlinux -- /bin/zsh

# --------------------------------------------
# TAB BAR SETTINGS
# --------------------------------------------
# Hide tab bar if only one tab (WezTerm: hide_tab_bar_if_only_one_tab = true)
tab_bar_min_tabs 2

# Tab bar position
tab_bar_edge bottom

# Use fancy tab bar (WezTerm: use_fancy_tab_bar = false)
tab_bar_style powerline


# BEGIN_KITTY_THEME
# Nightfox
include current-theme.conf
# END_KITTY_THEME
